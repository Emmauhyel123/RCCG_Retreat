<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Choir Retreat &amp; Concert 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a href="index.html" class="brand">
      <span class="brand-crest">RC</span>
      <span class="brand-text">
        <span class="line1">RCCG Taraba Province 2</span>
        <span class="line2">Choir Retreat</span>
      </span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html" data-i18n="nav_home">Home</a></li>
      <li><a href="login.html" data-i18n="nav_login">Login</a></li>
      <li class="mobile-only-nav-item" style="width:100%; justify-content:space-between; padding-top:8px; border-top:1px solid var(--wine-line); margin-top:6px;">
        <div class="lang-switch" role="group" aria-label="Language">
          <button data-lang="en" class="active">EN</button>
          <button data-lang="ha">HA</button>
          <button data-lang="yo">YO</button>
          <button data-lang="ig">IG</button>
        </div>
      </li>
    </ul>
    <div class="nav-right">
      <div class="lang-switch" role="group" aria-label="Language">
        <button data-lang="en" class="active">EN</button>
        <button data-lang="ha">HA</button>
        <button data-lang="yo">YO</button>
        <button data-lang="ig">IG</button>
      </div>
      <button class="nav-toggle" aria-label="Menu" aria-expanded="false">☰</button>
    </div>
  </nav>
</header>

<div class="auth-wrap">
  <div class="auth-side">
    <p class="hero-eyebrow"><span class="rule"></span><span data-i18n="reset_eyebrow">Account recovery</span></p>
    <h1 style="font-size: clamp(30px,4vw,44px); color: var(--cream);" data-i18n="reset_title">Reset your password</h1>
    <p class="hero-lede" data-i18n="reset_lede">Enter the email you registered with and we'll send a link to set a new password.</p>
    <div class="theme-text" style="color: var(--gold-soft);">"The Vessel God Uses"</div>
  </div>

  <div class="auth-form-side">
    <div class="form-wrap">

      <!-- Step 1: request a reset email -->
      <div id="reset-request-step">
        <h2 style="font-size:24px; margin-bottom:26px;" data-i18n="reset_request_title">Send reset link</h2>
        <form id="reset-request-form" novalidate>
          <div class="field">
            <label for="reset-email" data-i18n="login_email">Email address</label>
            <input type="email" id="reset-email" name="email" autocomplete="email" required>
          </div>
          <button type="submit" class="form-submit" data-i18n="reset_send_button">Send reset link</button>
          <p class="form-msg" id="reset-request-msg"></p>
        </form>
      </div>

      <!-- Step 2: shown only when arriving from the emailed link, to set a new password -->
      <div id="reset-confirm-step" style="display:none;">
        <h2 style="font-size:24px; margin-bottom:26px;" data-i18n="reset_confirm_title">Choose a new password</h2>
        <form id="reset-confirm-form" novalidate>
          <div class="field">
            <label for="reset-new-password" data-i18n="reset_new_password">New password</label>
            <input type="password" id="reset-new-password" name="password" autocomplete="new-password" required minlength="6">
          </div>
          <button type="submit" class="form-submit" data-i18n="reset_confirm_button">Set new password</button>
          <p class="form-msg" id="reset-confirm-msg"></p>
        </form>
      </div>

      <p class="form-foot"><a href="login.html" style="color:var(--crimson); text-decoration:none; font-weight:600;" data-i18n="nav_login">Login</a></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="main.js"></script>
</body>
</html>
